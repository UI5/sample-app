name: GitHub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# No permissions are required for this workflow
permissions: {}

jobs:
  test:
    name: General checks, tests and build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - name: Use Node.js 24 LTS
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci --engine-strict # --engine-strict is used to fail-fast if deps require node versions unsupported by the repo

    - name: Perform checks and tests
      run: npm test
      env:
        # Chrome cannot start its sandbox on GitHub's Ubuntu runners (unprivileged user
        # namespaces are disabled). ui5-test-runner v5 passed --no-sandbox implicitly, v6 does not.
        # See "Implicit Chrome flags from the version 5 default driver" in the v6 breaking changes.
        UI5TR_CHROME_ARGS: --no-sandbox

    - name: Perform preload build
      run: npm run build

    - name: Perform self-contained build
      run: npm run build-self-contained
